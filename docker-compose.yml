services:
  web:
    build: .
    env_file: .env
    ports:
      - "8000:8000"   # nicht 5000: auf macOS durch AirPlay belegt
    depends_on:
      - n8n

  n8n:
    image: n8nio/n8n:latest   # arm64-fähig, läuft auf dem M1
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Europe/Berlin
      - TZ=Europe/Berlin
      - N8N_SECURE_COOKIE=false
      - HUBRENT_API_URL=http://web:8000
      # Workflows lesen Fristen und Secrets per $env (siehe n8n/workflows)
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    env_file: .env
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro   # für: n8n import:workflow --separate --input=/workflows

volumes:
  n8n_data:
